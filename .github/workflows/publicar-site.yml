name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar-site
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Enviar por FTP para a HostGator
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            supabase/**
            testes/**
            node_modules/**
            .vscode/**
            package.json
            package-lock.json
            **/*.md
            **/*.sql
            **/*.csv
            **/*.xlsx
            **/*.xls
